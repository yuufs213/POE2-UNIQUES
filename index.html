<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>POE2 Unique Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Path of Exile 2</h1>
            <h2>Unique Tracker</h2>
            <div class="progress-ring" id="progressRing">
                <span id="percentText">0%</span>
            </div>
            <div class="summary">
                <span><strong id="collectedCount">0</strong> / <strong id="totalCount">439</strong></span>
                <span id="remainingCount">439 remaining</span>
            </div>
        </header>

        <main>
            <div class="controls">
                <input type="text" id="searchInput" placeholder="Search uniques...">
                <div class="segments">
                    <button class="segment active" data-status="all">All</button>
                    <button class="segment" data-status="missing">Missing</button>
                    <button class="segment" data-status="collected">Owned</button>
                </div>
                <div class="actions">
                    <button id="markVisibleButton">Mark Visible</button>
                    <button id="clearVisibleButton">Clear Visible</button>
                    <button id="importButton">Import</button>
                    <button id="exportButton">Export</button>
                    <input type="file" id="importFile" accept=".json" style="display: none;">
                </div>
            </div>

            <div id="categoryStrip" class="category-strip"></div>
            <div id="itemGrid" class="item-grid"></div>
        </main>

        <dialog id="itemDialog">
            <div class="dialog-content">
                <button id="dialogClose" class="close-btn">×</button>
                <img id="dialogImage" src="" alt="">
                <h3 id="dialogName"></h3>
                <p id="dialogMeta"></p>
                <button id="dialogToggle">Mark Owned</button>
            </div>
        </dialog>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
